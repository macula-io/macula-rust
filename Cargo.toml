[workspace]
members = ["macula-rust-ffi"]

[package]
name = "macula-rust"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "Rust port of macula's SDK (client/leaf) wire protocol — mobile first, not mobile-only. See plans/PLAN_WIRE_PROTOCOL.md."
license = "Apache-2.0"
repository = "https://github.com/macula-io/macula-rust"
homepage = "https://github.com/macula-io/macula-rust"
readme = "README.md"
keywords = ["mesh-network", "quic", "p2p", "ed25519", "decentralized"]
categories = ["network-programming", "cryptography"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand = "0.10"
sha2 = "0.11"
quinn = "0.11"
# The key exchange for every connection this crate dials: every TLS
# configuration starts from macula-pqc's client_builder(), which offers
# SecP384r1MLKEM1024 then SecP256r1MLKEM768 and nothing classical. So
# rustls selects no crypto provider of its own here. See transport.rs.
macula-pqc = "0.1"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
webpki-roots = "1.0"
x509-parser = "0.18"
# cert_chain.rs: pure X.509 path validation (no hostname/SAN check, unlike
# rustls's own ServerCertVerifier machinery in cert.rs) to a caller-supplied
# realm CA — already transitively pulled in by rustls, declared directly
# here since cert_chain.rs uses its EndEntityCert::verify_for_usage API.
rustls-webpki = { version = "0.103", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
# control_channel.rs: a session end and dropped unrouted frames are reported
# through the `log` facade, silent unless the application installs a logger.
# Already in the graph through rustls's `logging` feature.
log = "0.4"
blake3 = "1.5"
# ucan.rs: JWT-shaped token (de)serialization, matching the reference
# macula_ucan_nif's own dependency choices exactly (its Cargo.toml has no
# UCAN-spec crate either, only these same generic primitives).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# keystore.rs: platform-native secure storage for a persisted seed
# (Keychain via Security.framework on macOS/iOS, Secret Service via D-Bus
# on Linux, Credential Manager on Windows, Keystore via JNI on Android —
# each selected automatically per target by keyring's own Cargo.toml
# target-cfg blocks, not by any feature switching we do here). `v1`
# (default) covers macOS/Windows/Linux, but NOT iOS despite its own docs
# implying otherwise -- `v1` only forwards apple-native-keyring-store's
# `keychain` feature, and that backend is explicitly "Ignored on iOS" per
# apple-native-keyring-store's own module docs (iOS has only the
# "protected data" store, no legacy keychain at all); building for iOS
# without `protected` hits apple-native-keyring-store's own
# compile_error!("The `protected` feature is required on iOS"). Verified
# 2026-09-05 against real iOS CI (macula-cam2me's ios.yml), not assumed.
# `android-native-keyring-store` is added explicitly since it is NOT part
# of `v1`'s default set either.
keyring = { version = "4", features = ["android-native-keyring-store"] }
# keystore.rs's LinuxKeyutilsStore: a second, independently-selectable
# KeyStore backend demonstrating the trait is genuinely overridable, not
# just declared to be — uses the kernel's own keyutils facility directly
# (no D-Bus/secret-service daemon required), which is what makes it real-
# world useful on headless Linux (containers, CI, this dev sandbox) where
# no secret-service provider is running. Built via keyring-core's
# CredentialStoreApi::build() directly against one Store instance, NOT
# through keyring's own v1::Entry/set_default_store (a process-global,
# would collide with KeyringStore's own default-store selection if both
# were used in one process).
[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1"
linux-keyutils-keyring-store = "1"

# Unifies apple-native-keyring-store's `protected` feature into the same
# optional dependency keyring (v1, above) already pulls in for
# cfg(any(macos, ios)) -- see the comment on the main `keyring` line.
# Version constraint ("1") deliberately matches keyring 4.2.0's own exactly
# so Cargo resolves both to the SAME crate instance and unifies features,
# rather than risking two separate resolved versions.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
# Test-only: generates synthetic Ed25519 certs to unit-test
# PubkeyPinVerifier's matching logic without needing a live station that
# happens to present that cert type — see src/cert.rs's tests. Not a
# runtime dependency of the crate itself (see src/cert.rs's module doc:
# a dialing client never generates or presents a cert of its own).

# Test-only, cert_chain.rs's own tests: signed_by() needs a SubjectPublicKeyInfo
# constructed from a raw advertiser Ed25519 pubkey rather than a freshly
# rcgen-generated one (the leaf must bind the SAME key that signed the
# advertisement) — SubjectPublicKeyInfo::from_der needs this feature.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
# Test-only, transport.rs's own tests: the stations the dialler must still
# reach, or must refuse, are built from aws-lc-rs's own groups.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# Test-only, cert_chain.rs's own tests: rcgen's CertificateParams
# not_before/not_after fields take this crate's OffsetDateTime directly;
# not re-exported by rcgen, so declared explicitly (already transitively
# present via rcgen itself).
time = "0.3"
