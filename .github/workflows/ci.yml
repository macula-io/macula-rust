name: CI

on:
  push:
    branches: [master]
  pull_request:
  # A branch tip has to be able to prove itself before it is reviewed: without
  # this, the only way to get CI onto a branch is a pull request.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      # The integration tests dial macula-go's in-process stations
      # (tests/teststation), built to target/teststation first.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/teststation/go.mod
          cache-dependency-path: tests/teststation/go.sum
      - run: ./scripts/build-teststation.sh
      - run: cargo test --workspace --all-features --locked

  coverage:
    # A change that drops line coverage below the floor fails here (#50). The
    # floor is master's measured line coverage, rounded down to a whole
    # percent; it only goes up, in a commit that says why (README, Testing).
    name: coverage floor (lines)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/teststation/go.mod
          cache-dependency-path: tests/teststation/go.sum
      - run: cargo install cargo-llvm-cov --locked --version 0.6.21
      - run: ./scripts/build-teststation.sh
      - run: cargo llvm-cov --workspace --all-features --locked --summary-only --fail-under-lines 89

  windows-keystore:
    # A node key on Windows lives in Credential Manager only (#19): a real
    # round trip through it, and a key file refused.
    name: keystore on Windows (Credential Manager)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # `shell: bash`, or this step proves nothing: pwsh hands the script to a
      # child and exits 0 whatever it printed, so the job passes without the
      # check running (review of macula-io/macula-rust#54). Git Bash ships on
      # the Windows runner, and `rustup show` still reads rust-toolchain.toml.
      - name: Rust, as rust-toolchain.toml pins it
        shell: bash
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - run: "cargo test -p macula-rust --lib --locked -- keystore:: node_key::"

  android:
    # An Android app builds on this crate (macula-passport#3): both ABIs a
    # phone app ships must compile (#26). The runner image carries the NDK.
    name: builds for Android (arm64-v8a, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          rustup target add aarch64-linux-android x86_64-linux-android
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      # The runner's NDK path is a shell variable, not in the env context.
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk --platform 26 -t arm64-v8a -t x86_64 build -p macula-rust --locked

  key-files-without-hard-links:
    # Android refuses link(2) in an app's own storage (#28): the key-file
    # suites run where link and linkat fail with EACCES, as on a phone.
    name: key files without hard links (as on Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p macula-rust --locked --no-run --message-format=json \
            --test identity_layout --test identity_key_file \
            | jq -r 'select(.profile.test == true) | .executable' > suites.txt
      - run: |
          while read -r suite; do
            docker run --rm --security-opt seccomp=.github/seccomp/no-hard-links.json \
              -v "$PWD:$PWD" -w "$PWD" ubuntu:24.04 "$suite" </dev/null
          done < suites.txt

  doc:
    name: docs (deny broken links)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # The generated bindings must compile, not only generate (#61): uniffi emits
  # Kotlin that kotlinc refuses when the Rust API collides with AutoCloseable or
  # Throwable, and an app would find that out at its first build.
  ffi-bindings:
    name: uniffi bindings (kotlin generates and compiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p macula-rust-ffi --release
      - run: |
          cargo run -p macula-rust-ffi --release --bin uniffi-bindgen -- generate \
            --library target/release/libmacula_rust_ffi.so \
            --language kotlin --out-dir "$RUNNER_TEMP/bindings-kotlin" --no-format
      - run: scripts/compile_kotlin_bindings.sh "$RUNNER_TEMP/bindings-kotlin"

  ffi-bindings-swift:
    name: uniffi bindings (swift generates and type-checks)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p macula-rust-ffi --release
      - run: |
          cargo run -p macula-rust-ffi --release --bin uniffi-bindgen -- generate \
            --library target/release/libmacula_rust_ffi.dylib \
            --language swift --out-dir "$RUNNER_TEMP/bindings-swift" --no-format
      - run: scripts/typecheck_swift_bindings.sh "$RUNNER_TEMP/bindings-swift"

  # An Android app keeps its node key in the Android Keystore through the FFI
  # (#63): on an emulator, a saved key loads back as the same node, and the
  # JNI hook the app calls is in libmacula_rust_ffi.so itself.
  android-keystore:
    name: Android Keystore round trip (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          rustup target add x86_64-linux-android
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keystore round trip on an API 34 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/android_keystore_proof.sh x86_64

  # iOS keeps the node key in the protected-data keychain (#63); the SDK
  # builds that store itself on iOS, so the iOS build has to compile.
  ios:
    name: builds for iOS (device and simulator)
    runs-on: macos-latest
    env:
      # One deployment target for the C code (aws-lc, ring) and the Rust
      # link: without it the C objects target the SDK's newest iOS and the
      # link targets iOS 10, and ___chkstk_darwin is missing.
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          scripts/assert_toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p macula-rust-ffi --locked --target aarch64-apple-ios --target aarch64-apple-ios-sim

  # A known-vulnerable dependency fails the build (macula-codebase-checks#11).
  # The shared workflow, not a cargo audit step of our own: a step cannot be read
  # for whether it can fail, and its --ignore is an exception nobody dated.
  audit:
    name: Dependency advisories
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@83a76a358456bf2f7d6c919ad5e8fe7fd2162ce3
    with:
      ecosystem: rust

  # The Erlang cross-verifier in scripts/cross-verify-macula, held to the
  # structural floor (macula-codebase-checks#9): nesting 2, no nested
  # try/catch, no if, functions at most 60 lines. In the house build image,
  # since macula's NIFs build from source.
  erlang-helper-lint:
    name: Lint scripts/cross-verify-macula (structural floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1444@sha256:dd2ba6eb858a0eacedf0179300323fe5c6da46fb308d22da0ca8cfcd1f0718dc
    steps:
      - uses: actions/checkout@v4
      - name: rebar3 as lint lint
        working-directory: scripts/cross-verify-macula
        run: rebar3 as lint lint

  # The Go test stations in tests/teststation, held to the structural floor
  # (macula-codebase-checks#9): nestif 4, gocognit 15, funlen 60, with no
  # baseline and no inline disables. The thresholds live in
  # tests/teststation/.golangci.yml.
  go-helper-lint:
    name: Lint tests/teststation (structural floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/teststation/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: tests/teststation
