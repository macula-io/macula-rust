name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The integration tests dial macula-go's in-process stations
      # (tests/teststation), built to target/teststation first.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/teststation/go.mod
          cache-dependency-path: tests/teststation/go.sum
      - run: ./scripts/build-teststation.sh
      - run: cargo test --workspace --all-features --locked

  windows-keystore:
    # A node key on Windows lives in Credential Manager only (#19): a real
    # round trip through it, and a key file refused.
    name: keystore on Windows (Credential Manager)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - run: "cargo test -p macula-rust --lib --locked -- keystore:: node_key::"

  android:
    # An Android app builds on this crate (macula-passport#3): both ABIs a
    # phone app ships must compile (#26). The runner image carries the NDK.
    name: builds for Android (arm64-v8a, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      # The runner's NDK path is a shell variable, not in the env context.
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk --platform 26 -t arm64-v8a -t x86_64 build -p macula-rust --locked

  key-files-without-hard-links:
    # Android refuses link(2) in an app's own storage (#28): the key-file
    # suites run where link and linkat fail with EACCES, as on a phone.
    name: key files without hard links (as on Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p macula-rust --locked --no-run --message-format=json \
            --test identity_layout --test identity_key_file \
            | jq -r 'select(.profile.test == true) | .executable' > suites.txt
      - run: |
          while read -r suite; do
            docker run --rm --security-opt seccomp=.github/seccomp/no-hard-links.json \
              -v "$PWD:$PWD" -w "$PWD" ubuntu:24.04 "$suite" </dev/null
          done < suites.txt

  doc:
    name: docs (deny broken links)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  ffi-bindings:
    name: uniffi bindgen (kotlin + swift codegen smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p macula-rust-ffi --release
      - run: |
          cargo run -p macula-rust-ffi --release --bin uniffi-bindgen -- generate \
            --library target/release/libmacula_rust_ffi.so \
            --language kotlin --out-dir /tmp/bindings-kotlin --no-format
      - run: |
          cargo run -p macula-rust-ffi --release --bin uniffi-bindgen -- generate \
            --library target/release/libmacula_rust_ffi.so \
            --language swift --out-dir /tmp/bindings-swift --no-format

  # A known-vulnerable dependency fails the build (macula-codebase-checks#11).
  # The shared workflow, not a cargo audit step of our own: a step cannot be read
  # for whether it can fail, and its --ignore is an exception nobody dated.
  audit:
    name: Dependency advisories
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@dbc9533eb409c2118f45110613160060cc582f5d
    with:
      ecosystem: rust

  # The Erlang cross-verifier in scripts/cross-verify-macula, held to the
  # structural floor (macula-codebase-checks#9): nesting 2, no nested
  # try/catch, no if, functions at most 60 lines. In the house build image,
  # since macula's NIFs build from source.
  erlang-helper-lint:
    name: Lint scripts/cross-verify-macula (structural floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1444@sha256:dd2ba6eb858a0eacedf0179300323fe5c6da46fb308d22da0ca8cfcd1f0718dc
    steps:
      - uses: actions/checkout@v4
      - name: rebar3 as lint lint
        working-directory: scripts/cross-verify-macula
        run: rebar3 as lint lint

  # The Go test stations in tests/teststation, held to the structural floor
  # (macula-codebase-checks#9): nestif 4, gocognit 15, funlen 60, with no
  # baseline and no inline disables. The thresholds live in
  # tests/teststation/.golangci.yml.
  go-helper-lint:
    name: Lint tests/teststation (structural floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/teststation/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: tests/teststation
