[package]
name = "macula-rust-ffi"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "UniFFI mobile (Kotlin/Swift) bindings for macula-rust. Wraps the core crate; adds nothing to it."
license = "Apache-2.0"
repository = "https://github.com/macula-io/macula-rust"
homepage = "https://github.com/macula-io/macula-rust"
readme = "../README.md"
keywords = ["uniffi", "mobile", "mesh-network", "quic", "ffi"]
categories = ["network-programming", "cryptography"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[lib]
name = "macula_rust_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
macula-rust = { path = "..", version = "0.4" }
uniffi = { version = "0.32", features = ["cli", "tokio"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
# tests/live_cert_chain_direct_dial.rs's self-issued realm CA/leaf fixture,
# mirroring ../tests/live_cert_chain.rs's own — versions matched to the
# core crate's own pins.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = "0.3"
base64 = "0.23"
